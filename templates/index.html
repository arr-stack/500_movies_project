{% extends "base.html" %}

{% block content %}
<div>
    {% for item in items %}
    <h2><a href="/movies/movie/{{ item.id }}">{{ item.title }}</a></h2>
    <p><b>Year:</b> {{ item.year }}</p>
    <p>{{ item.desc }}</p>
    <hr>
{% endfor %}
<nav style="margin-top: 20px; font-family: sans-serif;">
    {% if page > 1 %}
    <a href="?page={{ page - 1 }}">&laquo; Назад</a>
    {% endif %}

    <span style="margin: 0 15px;">Страница {{ page }} из {{ total_pages }}</span>

    {% if page < total_pages %}
    <a href="?page={{ page + 1 }}">Вперед &raquo;</a>
    {% endif %}
</nav>
</div>
{% endblock %}
