<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}500 movies{% endblock %}</title>
    <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="/">Main page</a>
            <a href="/search">Search</a>
        {% if user %}
            <span><strong>{{ user.username }}</strong></span>
            <button type="submit" id="log_out">Log out</button>
        {% else %}
            <a href="/login/sign_in">Log IN</a>
            <a href="/login/sign_up">Sign Up</a>
        {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        {{ title }} - {{ year }}.
    </footer>
    <script>
        document.getElementById('log_out').addEventListener('click', () => {
        fetch('/login/logout', { method: 'post'}).then(() => { window.location.href = '/'});
        });
    </script>
</body>
</html>
